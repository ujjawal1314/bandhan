services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bandhan-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bandhan-backend
    environment:
      DATABASE_URL: postgresql://bandhan:bandhan_local_only@postgres:5432/bandhan
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: bandhan-postgres
    environment:
      POSTGRES_DB: bandhan
      POSTGRES_USER: bandhan
      POSTGRES_PASSWORD: bandhan_local_only
    ports:
      - "5432:5432"
    volumes:
      - bandhan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bandhan_postgres_data:
