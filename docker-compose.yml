services:
  # Future FastAPI backend placeholder. No API source is present in Review 1.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bandhan-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bandhan}:${POSTGRES_PASSWORD:-bandhan_local_only}@postgres:5432/${POSTGRES_DB:-bandhan}
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # PostgreSQL database for future application development.
  postgres:
    image: postgres:16-alpine
    container_name: bandhan-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bandhan}
      POSTGRES_USER: ${POSTGRES_USER:-bandhan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bandhan_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bandhan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Persists local PostgreSQL data between container restarts.
  bandhan_postgres_data:
